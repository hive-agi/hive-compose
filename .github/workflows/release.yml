name: release

# Patch-bump and publish to Clojars only when the push changes the library.
# README / CI / test-only commits do not mint a version, because a published
# pom is immutable.
#
# Secrets (per-repo or hive-agi org-wide): CLOJARS_USERNAME, CLOJARS_DEPLOY_TOKEN.
on:
  push:
    branches: [main, master]
    paths:
      - 'src/**'
      - 'resources/**'
      - 'deps.edn'
      # version.edn decides what the jar carries (:src-dirs, :publish),
      # and VERSION is the release floor: both must be able to release.
      - 'version.edn'
      - 'VERSION'
      # The suite gates the bump/deploy below, so a test-only change MUST be
      # able to trigger a run: excluded here, a test fix can never be validated
      # and a test-only regression stays invisible until an unrelated src push
      # trips over it.
      - 'test/**'
      - 'tests.edn'
      # Include the workflow itself so a change to the release pipeline is
      # exercised by the very push that makes it.
      - '.github/workflows/**'
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: DeLaGuardo/setup-clojure@13.7.0
        with:
          cli: latest

      # Gate BEFORE the bump: a published pom is immutable, so a red suite
      # must not be able to mint a version, tag it and ship it.
      - name: Test
        run: |
          if [ -d test ]; then
            clojure -M:test
          else
            echo "no test/ directory — nothing to gate on"
          fi

      # The release number comes from the tags, not from a commit back to main.
      # VERSION in the tree is a FLOOR (raise it in a staging PR to open a new
      # minor line); this run releases patch+1 of max(VERSION, newest v* tag).
      - name: Resolve release base from tags
        run: |
          set -euo pipefail
          FLOOR=$(tr -d '[:space:]' < VERSION)
          LAST=$(git tag -l 'v[0-9]*' --sort=-v:refname | head -n1 | sed 's/^v//')
          BASE=$(printf '%s\n%s\n' "$FLOOR" "${LAST:-$FLOOR}" | sort -V | tail -n1)
          echo "VERSION floor $FLOOR, newest tag ${LAST:-none}: base $BASE"
          printf '%s\n' "$BASE" > VERSION

      - name: Bump patch version
        run: clojure -T:build bump :level :patch

      - name: Tag
        run: |
          set -euo pipefail
          VER=$(tr -d '[:space:]' < VERSION)
          git config user.name  "hive-ci"
          git config user.email "ci@hive-agi.local"
          # Tag only, no commit: a version-bump commit on main is one staging
          # lacks, and it made every next staging->main PR conflict in VERSION.
          # Annotated, so the next run's tag scan and `git describe` see it.
          git tag -a "v$VER" -m "release $VER"
          git push origin "refs/tags/v$VER"

      - name: Deploy
        env:
          # deps-deploy and hive-build both read CLOJARS_PASSWORD; the org
          # secret is CLOJARS_DEPLOY_TOKEN. Map one onto the other.
          CLOJARS_USERNAME: ${{ secrets.CLOJARS_USERNAME }}
          CLOJARS_PASSWORD: ${{ secrets.CLOJARS_DEPLOY_TOKEN }}
        run: clojure -T:build deploy
