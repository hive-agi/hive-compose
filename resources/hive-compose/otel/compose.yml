# hive-compose built-in otel capability: grafana/otel-lgtm (OTel collector,
# Tempo, Loki, Prometheus, Pyroscope, Grafana in one container).
#
# Consumers export OTLP to it through the standard OTEL_* variables
# (hive-compose.promote.otel/otlp-env); nothing hive-specific runs inside a
# service. Every host port is overridable through the environment.
#
# The optional `beyla` service (native compose profile `beyla`) instruments
# services without an OTel SDK through eBPF and exports to the same endpoint:
#   docker compose -f compose.yml --profile beyla up -d
#
# Volumes are never removed by hive-compose; `lgtm-data` keeps telemetry
# across restarts.

name: ${HIVE_OTEL_PROJECT:-hive-otel}

services:
  lgtm:
    image: grafana/otel-lgtm:${HIVE_OTEL_LGTM_TAG:-0.41.1}
    labels:
      hive.capability: otel
      hive.capability.service: lgtm
    ports:
      - "${HIVE_OTEL_OTLP_GRPC_PORT:-4317}:4317"
      - "${HIVE_OTEL_OTLP_HTTP_PORT:-4318}:4318"
      - "${HIVE_OTEL_GRAFANA_PORT:-3000}:3000"
      - "${HIVE_OTEL_TEMPO_PORT:-3200}:3200"
      - "${HIVE_OTEL_LOKI_PORT:-3100}:3100"
      - "${HIVE_OTEL_PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - lgtm-data:/data
    healthcheck:
      # run-all.sh touches /tmp/ready once every component answers its probe.
      test: ["CMD-SHELL", "test -f /tmp/ready"]
      interval: 5s
      timeout: 3s
      retries: 60
      start_period: 10s
    restart: unless-stopped

  beyla:
    profiles: ["beyla"]
    image: grafana/beyla:${HIVE_OTEL_BEYLA_TAG:-3.43.0}
    labels:
      hive.capability: otel
      hive.capability.service: beyla
    privileged: true
    pid: host
    environment:
      # Ports of the processes to instrument; set it to the consumer's ports.
      BEYLA_OPEN_PORT: ${BEYLA_OPEN_PORT:-8080}
      OTEL_EXPORTER_OTLP_ENDPOINT: http://lgtm:4318
      OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
    depends_on:
      lgtm:
        condition: service_healthy
    restart: unless-stopped

volumes:
  lgtm-data:
    labels:
      hive.capability: otel
